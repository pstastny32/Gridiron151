<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gridiron 151</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f1729; --night2:#182340; --night3:#22305a; --line:#2c3b66;
  --ink:#1c2233; --paper:#f6f7fb; --text:#e9edf7; --muted:#8e9bbd;
  --red:#e2402f; --red-d:#9e2417; --gold:#f5b700; --gold-d:#a77c00;
  --hp-g:#4ade80; --hp-y:#fbbf24; --hp-r:#f05252;
  --turf1:#1f6b3a; --turf2:#1c6135;
  --px:"Press Start 2P", ui-monospace, monospace;
  --ui:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --rh:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--text);font-family:var(--ui);font-size:16px}
body{padding-bottom:calc(var(--sheet-h,290px) + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%, #23345f 0%, var(--night) 60%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;max-width:760px;margin:0 auto}
.logo{font-family:var(--px);font-size:15px;line-height:1.3;letter-spacing:1px;color:var(--paper);text-shadow:2px 2px 0 var(--red-d)}
.logo small{display:block;font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.2px;color:var(--muted);text-shadow:none;margin-top:4px}
.hdr{display:flex;align-items:center;gap:8px}
.count{font-family:var(--px);font-size:9px;color:var(--gold);background:var(--night2);border:2px solid var(--line);border-radius:6px;padding:8px 9px;white-space:nowrap}
.icon{width:34px;height:34px;border-radius:8px;background:var(--night2);border:2px solid var(--line);font-family:var(--px);font-size:11px}

/* ---------- field ---------- */
main{max-width:760px;margin:0 auto;padding:0 10px}
.field{position:relative;border-radius:10px;overflow:hidden;padding:10px 4px 12px;
  background:repeating-linear-gradient(180deg,var(--turf1) 0 46px,var(--turf2) 46px 92px);
  border:3px solid #e8efe9;box-shadow:0 0 0 3px #0b1220, 0 14px 40px rgba(0,0,0,.45)}
.field::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 91px,rgba(255,255,255,.28) 91px 93px),
             radial-gradient(90% 50% at 50% 0%,rgba(255,255,255,.10),transparent 70%)}
.side{position:relative;z-index:1}
.unit-tag{font-family:var(--px);font-size:7px;letter-spacing:2px;color:rgba(255,255,255,.5);text-align:center;margin:2px 0 6px}
.row{display:flex;justify-content:center;gap:4px;margin:5px 0}
.row.spread{justify-content:space-around}
.row.wide{justify-content:space-between;padding:0 2px}
.los{position:relative;z-index:1;height:3px;margin:9px 4px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,transparent 12px 18px)}

.slot{position:relative;width:calc((100% - 20px)/6);max-width:100px;min-width:0;height:56px;border-radius:6px;padding:4px 2px;
  background:rgba(8,16,30,.38);border:2px dashed rgba(255,255,255,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .12s, border-color .12s}
.slot .pos{font-weight:800;font-size:15px;letter-spacing:.5px;color:rgba(255,255,255,.92)}
.slot .nm{font-weight:700;font-size:12.5px;line-height:1;text-align:center;letter-spacing:.2px;width:100%;overflow:hidden;white-space:nowrap}
.slot .rt{position:absolute;top:-7px;right:-5px;min-width:24px;height:17px;padding:0 4px;border-radius:4px;font-weight:800;font-size:12px;line-height:17px;text-align:center;color:var(--ink);box-shadow:0 0 0 2px var(--night)}
.field.armed .slot:not(.filled){border-color:rgba(245,183,0,.8);background:rgba(245,183,0,.10);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{background:rgba(245,183,0,.2)}}
.slot.filled{background:var(--night);border:2px solid #0a1120;padding-top:9px;overflow:hidden;cursor:default;animation:none}
.slot.filled::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--t1) 0 50%,var(--t2) 50% 100%)}
.slot.filled .pos{font-size:10px;color:var(--muted);order:2}
.slot.filled .nm{color:var(--paper)}
.slot.filled .star{position:absolute;top:7px;right:3px;font-size:9px;color:var(--gold)}
.slot.selected{border:2px solid var(--gold)!important;background:rgba(245,183,0,.35)!important;transform:scale(1.07);animation:none!important}
.slot.flash{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.st-wrap{margin:10px 0 0;background:var(--night2);border:2px solid var(--line);border-radius:10px;padding:8px 8px 10px}
.st-wrap .unit-tag{color:var(--muted)}
.st-wrap .slot{width:30%;max-width:120px;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.25)}

/* ---------- console (bottom sheet) ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--night2);border-top:3px solid #0a1120;
  box-shadow:0 -1px 0 var(--line) inset, 0 -12px 30px rgba(0,0,0,.5);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.sheet-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.machine{background:linear-gradient(180deg,var(--red),#c8301f);border-radius:10px;padding:6px;box-shadow:0 3px 0 var(--red-d), inset 0 2px 0 rgba(255,255,255,.25)}
.reels{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:5px}
.reel{position:relative;height:var(--rh);overflow:hidden;border-radius:5px;background:var(--paper);border:3px solid var(--ink)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(28,34,51,.28),transparent 32%,transparent 68%,rgba(28,34,51,.28))}
.strip{will-change:transform}
.ri{height:calc(var(--rh) - 6px);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 4px;
  font-family:var(--px);font-size:9px;color:var(--ink);white-space:nowrap;overflow:hidden}
.ri .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--ink);flex:none}
.ri .pip{display:inline-block;width:7px;height:7px;background:var(--ink);margin-right:2px}
.ri .pip.off{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.ri.legend{background:var(--gold);}
.ri.blank{color:#b7bfd3;font-size:12px}
.respins{display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:5px;margin-top:5px}
.rs{height:28px;border-radius:5px;border:0;background:rgba(0,0,0,.25);color:#fff;font-weight:700;font-size:13.5px;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:6px}
.rs b{font-family:var(--px);font-size:8px;background:var(--paper);color:var(--ink);border-radius:3px;padding:3px 4px}
.rs:disabled{opacity:.4;cursor:not-allowed}

.dialog{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:10px 12px 9px;
  box-shadow:inset 0 0 0 2px var(--paper), inset 0 0 0 4px #b9c1d6;min-height:96px}
.dialog .line{font-family:var(--px);font-size:10px;line-height:1.7}
.dialog .line .nm{color:var(--red)}
.dialog .sub{font-size:15px;font-weight:600;color:#4a5370;margin-top:4px;line-height:1.25}
.mon{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dexno{font-family:var(--px);font-size:8px;color:#6c7593}
.tpill{font-weight:800;font-size:12px;letter-spacing:.6px;color:#fff;background:var(--c);border-radius:4px;padding:2px 7px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.shiny{color:var(--gold-d);font-family:var(--px);font-size:8px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.st .k{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;color:#4a5370}
.st .k b{color:var(--ink);font-weight:800}
.bar{height:6px;background:#dfe3ee;border-radius:3px;overflow:hidden;margin-top:2px;box-shadow:inset 0 0 0 1px #c7cddd}
.bar i{display:block;height:100%;border-radius:3px}
.dialog .caret{position:absolute;right:10px;bottom:6px;font-size:10px;color:var(--red);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.action{height:50px;border-radius:8px;border:3px solid var(--ink);font-family:var(--px);font-size:12px;letter-spacing:1px;
  background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.action:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-d)}
.action:disabled{background:var(--night3);color:var(--muted);border-color:var(--line);box-shadow:none;font-family:var(--ui);font-size:16px;font-weight:700;letter-spacing:.2px}
.action.place{background:var(--hp-g);box-shadow:0 4px 0 #1f8a4a}
.action.go{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,10,20,.8);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.modal{background:var(--night2);border:3px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:14px;border-bottom:3px solid var(--line)}}
.modal h2{font-family:var(--px);font-size:13px;line-height:1.5;margin:0 0 10px;color:var(--paper)}
.modal h3{font-family:var(--px);font-size:9px;margin:22px 0 10px;color:var(--gold);letter-spacing:1px}
.modal p,.modal li{font-size:17px;line-height:1.4;color:#cfd6ea}
.modal ul{padding-left:18px;margin:6px 0}
.mclose{float:right;background:none;border:0;font-size:28px;color:var(--muted);line-height:1;padding:0 4px}
.record{font-family:var(--px);font-size:34px;line-height:1;color:var(--paper);text-shadow:4px 4px 0 var(--red-d)}
.grade{display:inline-block;font-family:var(--px);font-size:16px;color:var(--ink);border:3px solid var(--ink);border-radius:6px;padding:7px 10px;margin-left:12px;vertical-align:middle}
.kpis,.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kpi{background:var(--night);border:2px solid var(--line);border-radius:8px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:24px;font-weight:800}
.kpi span{font-size:13px;color:var(--muted);font-weight:600}
.cards3 .kpi b{font-family:var(--px);font-size:16px;margin:4px 0 6px}
table{width:100%;border-collapse:collapse;font-size:16px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td small{font-size:13px}
.W{color:var(--hp-g);font-weight:800}.L{color:var(--hp-r);font-weight:800}
.match{color:var(--gold)}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;height:48px;border-radius:8px;border:2px solid var(--line);background:var(--night3);font-weight:700;font-size:17px}
.btn.pri{background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 var(--gold-d)}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);opacity:0;background:var(--paper);color:var(--ink);border:3px solid var(--ink);
  padding:10px 14px;border-radius:8px;font-family:var(--px);font-size:9px;line-height:1.6;z-index:80;transition:transform .25s,opacity .25s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.gchip{display:inline-block;min-width:38px;text-align:center;font-family:var(--px);font-size:10px;color:var(--ink);border-radius:4px;padding:5px 6px}
.finish{display:inline-block;margin:12px 0 2px;padding:7px 12px;border-radius:6px;font-weight:800;font-size:16px}
.finish.in{background:rgba(74,222,128,.14);color:var(--hp-g);border:2px solid rgba(74,222,128,.4)}
.finish.out{background:rgba(240,82,82,.12);color:var(--hp-r);border:2px solid rgba(240,82,82,.35)}
.bracket{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:14px}
.bracket::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:3px;background:var(--line);border-radius:2px}
.rd{position:relative;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:8px 10px}
.rd::before{content:"";position:absolute;left:-17px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--line);box-shadow:0 0 0 3px var(--night2)}
.rd.won::before{background:var(--hp-g)}.rd.lost::before{background:var(--hp-r)}.rd.bye::before{background:var(--gold)}
.rd.lost{border-color:var(--hp-r)}
.rd.locked{background:transparent;border:2px dashed var(--line);color:var(--muted)}
.rd .rn{font-family:var(--px);font-size:8px;letter-spacing:.5px;margin-bottom:6px;color:#6c7593}
.rd.locked .rn{color:var(--muted)}
.mu{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;padding:3px 0}
.mu.w{font-weight:800}.mu.w .sc{color:var(--ink)}
.mu.dim{font-size:14px;color:#8a92aa;font-weight:600}
.mu .seed{font-family:var(--px);font-size:8px;color:#6c7593;min-width:22px}
.mu .sc{margin-left:auto;font-family:var(--px);font-size:12px;color:#8a92aa}
.banner{background:var(--gold);color:var(--ink);border:3px solid var(--ink);font-family:var(--px);font-size:10px;line-height:1.6;border-radius:8px;padding:10px 12px;margin:12px 0;text-align:center}
.note{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:16px;line-height:1.35}
.note .nh{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;font-size:15px;color:#4a5370;font-weight:600}
.note .nh b{color:var(--ink);font-weight:800}
.note .tone{width:9px;height:9px;border-radius:50%;flex:none;align-self:center}
.note.good .tone{background:var(--hp-g)}.note.bad .tone{background:var(--hp-r)}.note.meh .tone{background:var(--hp-y)}
.note .nr{margin-left:auto;font-family:var(--px);font-size:10px;color:var(--ink)}
.unit{background:var(--night);border:2px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.uh{display:flex;align-items:center;justify-content:space-between}
.uh h4{margin:0;font-size:22px;font-weight:800}
.uh .gchip{font-size:13px;padding:7px 9px}
.usub{font-size:15px;color:var(--muted);margin:2px 0 8px}
.grp{display:grid;grid-template-columns:1fr auto 48px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.grp .gv{font-weight:800;font-variant-numeric:tabular-nums}.grp small{color:var(--muted);font-weight:600}
.grp .gchip{justify-self:end}
.sw{font-size:16px;margin:8px 0 4px}
details{margin-top:8px}
summary{cursor:pointer;font-size:16px;font-weight:700;color:var(--gold);padding:4px 0}
.modal .menu-btn{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border-radius:8px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);font-family:var(--px);font-size:10px}
.modal .menu-btn::before{content:"▶ ";color:var(--red)}
.modal .menu-btn[hidden]{display:none}

.card-ov{align-items:center;background:rgba(6,10,20,.94)}
.cardwrap{width:100%;max-width:430px;padding:10px;max-height:100vh;overflow:auto}
#card{background:var(--night);border:3px solid var(--line);border-radius:12px;padding:12px 10px 10px;
  background-image:radial-gradient(120% 50% at 50% 0%,#23345f 0%,var(--night) 70%)}
.cardhead{text-align:center}
.clogo{font-family:var(--px);font-size:11px;color:var(--paper);text-shadow:2px 2px 0 var(--red-d);letter-spacing:1px}
.crec{font-family:var(--px);font-size:38px;line-height:1;margin:10px 0 6px;color:var(--paper);text-shadow:4px 4px 0 var(--red-d)}
.cfin{display:inline-block;font-weight:800;font-size:14px;letter-spacing:.5px;color:var(--hp-g)}
.cfin.champ{color:var(--gold)}.cfin.out{color:var(--hp-r)}
.cgrades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.cgrades div{background:var(--night2);border:2px solid var(--line);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cgrades b{font-family:var(--px);font-size:11px;color:var(--ink);border-radius:4px;padding:4px 5px;min-width:30px}
.cgrades span{font-size:12px;font-weight:700;color:var(--muted)}
.cfield{border-radius:8px;padding:6px 3px;border:2px solid #e8efe9;background:repeating-linear-gradient(180deg,var(--turf1) 0 30px,var(--turf2) 30px 60px)}
.crow{display:flex;justify-content:center;gap:3px;margin:3px 0}
.crow.spread{justify-content:space-around}.crow.wide{justify-content:space-between}
.clos{height:2px;margin:5px 2px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 12px)}
.ct{position:relative;width:calc((100% - 15px)/6);max-width:68px;height:38px;background:var(--night);border-radius:4px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px 1px}
.ct::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--t1) 0 50%,var(--t2) 50% 100%)}
.cn{font-weight:700;font-size:10.5px;line-height:1;color:var(--paper);width:100%;text-align:center;white-space:nowrap;overflow:hidden}
.cp{font-size:9.5px;font-weight:700;color:var(--muted);margin-top:2px}
.cp{display:flex;align-items:center;gap:3px}.cr{font-style:normal;font-size:9px;font-weight:800;color:var(--ink);border-radius:2px;padding:0 3px;line-height:12px}
.cst{margin-top:6px;background:var(--night2);border:2px solid var(--line);border-radius:8px;padding:2px 3px}
.cst .ct{width:30%;max-width:110px}
.cfoot{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.cardbtns{display:flex;gap:8px;margin-top:10px}
/* art (optional: art/001.png … art/151.png) */
.dtop{display:flex;align-items:center;gap:10px}
.dartbox{flex:none;width:96px;height:96px;border-radius:8px;background:radial-gradient(circle at 50% 60%,#e3e8f4,#f6f7fb 70%);display:flex;align-items:center;justify-content:center}
.dart{width:100%;height:100%;object-fit:contain}
.dart.shiny-art{filter:drop-shadow(0 0 8px rgba(245,183,0,.95))}
.dtext{min-width:0;flex:1}
/* field tile with art: just the art, then name and position on the open field (no box, no edges) */
.slot.filled.has-art,body.art-on .slot.filled{height:92px}
.slot.filled.has-art{background:transparent;border:0;padding:0;overflow:visible;justify-content:flex-start;gap:0}
.slot.filled.has-art::before{display:none}
.slot.filled.has-art .fart{order:0;width:100%;height:62px;object-fit:contain;margin:0;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.slot.filled.has-art .nm{order:1;margin:2px 0 0;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.6)}
.slot.filled.has-art .pos{order:2;position:static;font-size:10px;font-weight:800;color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.9)}
.slot.filled.has-art .star{top:0;right:2px;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.slot.filled.has-art.selected,.slot.filled.has-art.flash{background:transparent!important}
.ct.has-art,body.art-on .ct{height:66px}
.ct.has-art{background:transparent;padding:0;justify-content:flex-start;overflow:visible}
.ct.has-art::before{display:none}
.ct .cart{position:static;width:100%;height:42px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45))}
.ct.has-art .cn{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);margin-top:1px}
.ct.has-art .cp{color:var(--gold);text-shadow:0 1px 2px rgba(0,0,0,.9)}

// Hungarian algorithm (n rows <= m cols), minimizes cost
function hungarian(a) {

// Images live next to index.html in art/, art2/ or art3/, named by Pokédex number.

const ART_DIRS = ['art/', 'art2/', 'art3/'];

  else if (!state.cur) { a.textContent = 'SPIN'; a.onclick = spin; }
  else if (!state.sel) { a.textContent = `Tap a spot on the field for ${UP(P(state.cur.dex).name)}`; a.disabled = true; }
  else { a.textContent = `PLACE AT ${SLOT_BY_ID[state.sel].pos}`; a.classList.add('place'); a.onclick = lockIn; }
  $('#btnShowResults').hidden = !state.done;
}
function render() {
  renderField(); renderInfo(); renderControls();
  document.body.style.setProperty('--sheet-h', $('#sheet').offsetHeight + 14 + 'px');
}

// ---------- results ----------
const gColor = g => g === 'S' || g.startsWith('A') ? '#3ddc84' : g.startsWith('B') ? '#b5e655' : g.startsWith('C') ? '#ffd23f' : g === 'D' ? '#ff9f43' : '#ff5a4f';
const gChip = g => `<span class="gchip" style="background:${gColor(g)}">${g}</span>`;
const gWord = g => g === 'A+' ? 'Elite' : g[0] === 'A' ? 'Excellent' : g[0] === 'B' ? 'Solid' : g[0] === 'C' ? 'Shaky' : g === 'D' ? 'Struggling' : 'Liability';
function seasonStory(res) {
  if (res.perfect) return 'A perfect lineup. Undefeated, a playoff sweep and an Indigo Bowl ring. Nobody in Kanto came close.';
  const rec = `${res.wins}–${res.losses}`;
  if (!res.seed) return res.wins === 9 ? `Finished ${rec} and missed the playoffs on the final weekend. So close.` : `Finished ${rec}. No playoffs this year. ${res.wins <= 4 ? 'At least the draft pick will be high.' : 'A few better placements and this is a wild-card team.'}`;
  const seedTxt = res.seed === 1 ? 'clinched the #1 seed and a first-round bye' : `earned the #${res.seed} seed`;
  if (res.champ) return `Went ${rec}, ${seedTxt}, then ran the table. Indigo Bowl Champions!`;
  const last = res.playoffs[res.playoffs.length - 1];
  const where = { 'Wild Card Weekend': 'on Wild Card Weekend', 'Divisional Round': 'in the Divisional Round', 'Championship Sunday': 'on Championship Sunday', 'Indigo Bowl': 'in the Indigo Bowl' }[last.round];
  return `Went ${rec} and ${seedTxt}. The run ended ${where}, falling ${last.us}–${last.them} to the ${last.name}.`;
}
function seasonPoints(res) {
  const all = res.games.concat(res.playoffs.filter(g => !g.bye));
  return { pf: all.reduce((a, g) => a + g.us, 0), pa: all.reduce((a, g) => a + g.them, 0) };
}
function showResults() {
  const res = simulateSeason(state.picks), units = unitReport(state.picks), scout = scoutingReport(state.picks);
  const mvp = scout.notes.reduce((b, n) => n.r > b.r ? n : b);
  const pts = seasonPoints(res);
  const bracket = PLAYOFF_ROUNDS.map(([round], i) => {
    const g = res.playoffs[i];
    if (!g) return `<div class="rd locked"><div class="rn">${UP(round)}</div><div class="mu dim">Eliminated before this round</div></div>`;
    if (g.bye) return `<div class="rd bye"><div class="rn">${UP(round)}</div><div class="mu"><span class="seed">#1</span><b>Your team</b><span class="sc">BYE</span></div><div class="mu dim">Top seed rests at home</div></div>`;
    return `<div class="rd ${g.win ? 'won' : 'lost'}"><div class="rn">${UP(round)}${i === 3 ? ' ★' : ''}</div>
      <div class="mu ${g.win ? 'w' : ''}"><span class="seed">#${res.seed}</span><b>Your team</b><span class="sc">${g.us}</span></div>
      <div class="mu ${g.win ? '' : 'w'}"><span class="seed">#${g.oppSeed}</span>${g.name}<span class="sc">${g.them}</span></div></div>`;
  }).join('');
  const games = res.games.map(g => `<tr><td>Wk ${g.week}</td><td>${g.name}</td><td class="${g.win ? 'W' : 'L'}">${g.win ? 'W' : 'L'}</td><td class="n">${g.us}–${g.them}</td></tr>`).join('');
  const noteHTML = n => `<div class="note ${n.tone}"><div class="nh"><span class="tone"></span><b>${UP(n.name)}</b> at ${n.pos}</div><div>${n.text}</div></div>`;
  const unitCards = units.map(u => {
    const groups = u.groups.map(g => `<div class="grp"><span>${g.name}</span><span class="gv">${gWord(g.grade)}</span>${gChip(g.grade)}</div>`).join('');
    const sw = u.groups.length > 1 && u.strength !== u.weakness
      ? `<p class="sw"><b style="color:var(--hp-g)">Strength:</b> ${u.strength.name} · <b style="color:var(--hp-r)">Weakness:</b> ${u.weakness.name}</p>` : '';
    return `<div class="unit"><div class="uh"><h4>${u.name}</h4>${gChip(u.grade)}</div>${groups}${sw}</div>`;
  }).join('');
  const finishBanner = res.champ ? `<div class="banner">★ ${UP(res.finish)} ★</div>` :
    `<div class="finish ${res.seed ? 'in' : 'out'}">${res.seed ? `#${res.seed} seed · ` : ''}${res.finish}</div>`;
  const shinyBox = scout.shiny ? `<div class="note ${shinyEarned(state.picks[scout.shiny.slotId].dex, scout.shiny.slotId) ? 'good' : 'bad'}"><div class="nh"><span class="tone"></span><b>★ SHINY ${UP(scout.shiny.name)}</b> at ${scout.shiny.pos}</div><div>${shinyEarned(state.picks[scout.shiny.slotId].dex, scout.shiny.slotId) ? 'Placed in a great spot. The shiny bonus kicked in all season.' : 'Wrong spot for this one. The shiny bonus never kicked in.'}</div></div>` : '';
  $('#results').innerHTML = `
    <button class="mclose" data-close>×</button>
    <h2>SEASON REPORT</h2>
    <div><span class="record">${res.wins}–${res.losses}</span><span class="grade" style="background:${gColor(res.grade)}">${res.grade}</span></div>
    ${finishBanner}
    <p>${seasonStory(res)}</p>
    <div class="kpis">
      <div class="kpi"><b>${Math.round(res.pct * 100)}%</b><span>Of perfect</span></div>
      <div class="kpi"><b>${pts.pf}</b><span>Points for</span></div>
      <div class="kpi"><b>${pts.pa}</b><span>Points against</span></div>
    </div>
    <div class="btnrow"><button class="btn pri" id="btnCard">Share card</button><button class="btn" id="btnShare">Share text</button></div>
    <div class="btnrow" style="margin-top:8px"><button class="btn" id="btnAgain">Play again</button></div>
    ${res.seed ? `<h3>Playoff bracket</h3><div class="bracket">${bracket}</div>` : ''}
    <h3>Report card</h3>
    <div class="cards3">${units.map(u => `<div class="kpi"><b style="color:${gColor(u.grade)}">${u.grade}</b><span>${u.name}</span></div>`).join('')}</div>
    <p>Season MVP: <b>${UP(mvp.name)}</b> at ${mvp.pos}.</p>
    ${shinyBox ? `<h3>Shiny pick</h3>${shinyBox}` : ''}
    ${scout.hits.length ? `<h3>Smart picks</h3>${scout.hits.map(noteHTML).join('')}` : ''}
    ${scout.misses.length ? `<h3>Questionable calls</h3>${scout.misses.map(noteHTML).join('')}` : ''}
    <h3>Unit breakdown</h3>${unitCards}
    <h3>Regular season</h3><table>${games}</table>
    <p style="font-size:14px;color:var(--muted)">% of perfect compares your lineup to the best possible one. Find that lineup and you won't lose a game.</p>`;
  $('#btnAgain').onclick = newGame;
  $('#btnShare').onclick = () => share(res, units, mvp);
  $('#btnCard').onclick = () => showCard(res, units, mvp);
  openOv('#ov-results');
}
async function share(res, units, mvp) {
  const text = `Gridiron 151\n${res.wins}–${res.losses} · ${res.finish}\nGrade ${res.grade} · ${Math.round(res.pct * 100)}% of perfect\n` +
    units.map(u => `${u.name} ${u.grade}`).join(' · ') + `\nMVP ${mvp.name} (${mvp.pos})`;
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text); toast('Copied to clipboard');
  } catch (e) { toast('Could not share. Try again.'); }
}

// ---------- share card (screenshot-ready) ----------
function showCard(res, units, mvp) {
  const tile = s => {
    const pk = state.picks[s.id], p = P(pk.dex), art = artImg(p.dex, 'cart');
    return `<div class="ct${art ? ' has-art' : ''}" style="--t1:${TYPES[p.types[0]].c};--t2:${TYPES[p.types[1] || p.types[0]].c}">${art}<span class="cn">${UP(p.name)}</span><span class="cp">${s.pos}${pk.shiny ? ' ★' : ''}</span></div>`;
  };
  const row = (id, cls = '') => `<div class="crow ${cls}">${SLOTS.filter(s => s.row === id).map(tile).join('')}</div>`;
  const finish = res.champ ? 'INDIGO BOWL CHAMPIONS' : res.seed ? `#${res.seed} SEED · ${UP(res.finish)}` : UP(res.finish);
  $('#card').innerHTML = `
    <div class="cardhead">
      <div class="clogo">GRIDIRON 151</div>
      <div class="crec">${res.wins}–${res.losses}</div>
      <div class="cfin ${res.champ ? 'champ' : res.seed ? '' : 'out'}">${finish}</div>
      <div class="cgrades">
        <div><b style="background:${gColor(res.grade)}">${res.grade}</b><span>Overall</span></div>
        ${units.map(u => `<div><b style="background:${gColor(u.grade)}">${u.grade}</b><span>${u.name === 'Special Teams' ? 'Special' : u.name}</span></div>`).join('')}
      </div>
    </div>
    <div class="cfield">
      ${row('d1', 'spread')}${row('d2')}${row('d3')}
      <div class="clos"></div>
      ${row('o1')}${row('o2', 'wide')}${row('o3')}${row('o4')}
    </div>
    <div class="cst">${row('st', 'spread')}</div>
    <div class="cfoot">${Math.round(res.pct * 100)}% of perfect · MVP ${UP(mvp.name)} (${mvp.pos})</div>`;
  closeAll(); openOv('#ov-card');
  document.querySelectorAll('#card .cn').forEach(fitText);
}
async function saveCard() {
  try {
    if (!window.html2canvas) await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    const canvas = await html2canvas($('#card'), { backgroundColor: '#0f1729', scale: 2, useCORS: true });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], 'gridiron151.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gridiron151.png'; a.click();
  } catch (e) { toast('Couldn’t save the image. Take a screenshot instead.'); }
}

// ---------- help ----------
function buildHelp() {
  const total = STAGES.reduce((a, s) => a + STAGE_WEIGHT[s], 0);
  const pct = s => Math.round(STAGE_WEIGHT[s] / total * 100) + '%';
  $('#help').innerHTML = `
    <button class="mclose" data-close>×</button>
    <h2>HOW TO PLAY</h2>
    <ul>
      <li>Fill all <b>25 spots</b>: 11 on offense, 11 on defense (a 3-4), plus a kicker, a punter and a returner.</li>
      <li><b>Spin</b> to roll a <b>type</b>, then an <b>evolution stage</b>, then a <b>Pokémon</b> that matches both.</li>
      <li>Tap an open spot on the field, then <b>Place</b>. Once placed, a Pokémon can't move.</li>
      <li>Each Pokémon can only be picked once. Other members of its evolution line are still in play.</li>
      <li>Use each Pokémon's stats to decide where it fits. Nobody tells you if it's a good spot until the season is over.</li>
    </ul>
    <h3>Respins (5 of each per game)</h3>
    <ul>
      <li><b>Type</b> rolls a new type and keeps the same evolution stage. The Pokémon changes too.</li>
      <li><b>Evolution</b> keeps the type and rolls a new stage. Because the stage changes, you get a new Pokémon as well.</li>
      <li><b>Pokémon</b> keeps the type and stage and gives you a different Pokémon.</li>
    </ul>
    <h3>Odds</h3>
    <ul>
      <li>Every type is equally likely. Pokémon with two types can show up under either one. Dragon-types show up under Flying.</li>
      <li>Stage 1 ${pct('1')} · Stage 2 ${pct('2')} · Stage 3 ${pct('3')} · Legendary ${pct('L')}. Only stages that exist for that type can land.</li>
      <li>Pokémon that never evolve count as Stage 1. The legendaries are Articuno, Zapdos, Moltres, Mewtwo and Mew.</li>
    </ul>
    <h3>The shiny spin</h3>
    <p>One random spin each game is shiny. It could be your 2nd pick or your 20th. Put it in a spot that suits it and it gets a boost all season. Put it somewhere it doesn't fit and the boost never kicks in. You'll find out which in your season report.</p>
    <h3>The season</h3>
    <p>You play 17 games against teams that range from easy to elite. Win 10 or more to make the playoffs, and 14 or more earns the #1 seed and a bye. Then it's Wild Card Weekend, the Divisional Round, Championship Sunday and the Indigo Bowl. The same lineup always gets the same season.</p>
    <p>Afterward you get a report card: grades for offense, defense and special teams, your MVP, and your smartest picks and most questionable calls.</p>`;
}

// ---------- misc ----------
function openOv(sel) { $(sel).hidden = false; }
function closeAll() { document.querySelectorAll('.overlay').forEach(o => o.hidden = true); }
document.addEventListener('click', e => {
  if (e.target.matches('[data-close]') || e.target.classList.contains('overlay')) closeAll();
});
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

document.querySelectorAll('.rs').forEach(b => b.addEventListener('click', () => respin(b.dataset.r)));
$('#btnHelp').onclick = () => openOv('#ov-help');
$('#btnMenu').onclick = () => openOv('#ov-menu');
$('#btnSaveCard').onclick = saveCard;
$('#btnCardBack').onclick = () => { closeAll(); showResults(); };
$('#btnHelp2').onclick = () => { closeAll(); openOv('#ov-help'); };
$('#btnNew').onclick = () => { if (confirm('Start a new game? Your current team will be lost.')) newGame(); };
$('#btnShowResults').onclick = () => { closeAll(); showResults(); };
window.addEventListener('resize', render);

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render());
load(); buildField(); buildHelp(); staticReels(); render();
try { if (!localStorage.getItem('gridiron151_seen')) { localStorage.setItem('gridiron151_seen', '1'); openOv('#ov-help'); } } catch (e) { openOv('#ov-help'); }

</script>
</body>
